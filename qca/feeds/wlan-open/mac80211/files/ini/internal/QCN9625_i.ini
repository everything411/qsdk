# Spectral scan buffer configuration
# Defines the maximum number of spectral scan buffers
# This directly impacts memory usage - configure based on system requirements
#
# Valid range: 512 - 4095
#   Minimum 512: Required for reliable spectral operation (~2MB per radio)
#   Maximum 4095: Hardware/driver limit (~16MB per radio)
#
# Memory impact per radio (approximate):
#   512 buffers:  ~300 KB  (default, memory-efficient)
#   1024 buffers: ~600 KB  (512MB systems)
#   4095 buffers: ~2.4 MB  (1GB+ systems, full capability)
#
# Default: 512 (valid range: 512-4095)
# Customers can adjust this value based on memory availability
spectral_scan_count_max=512
