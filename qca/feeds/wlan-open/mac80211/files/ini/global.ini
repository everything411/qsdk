# INI file
# This file will contain global INI configurations

# Datapath configuration Parameters
# Add the data path specific config parameters below
# E.g For DP_RXDMA_BUF_RING
# dp_rxdma_buf_ring=8192

# IPA specific INI for TX/RX rings
dp_ipa2wbm_idle_ring_sz=12228
dp_ipa2wbm_host_ring_sz=4096
dp_ipa2wbm_ipa_ring_sz=12228
dp_ipa2tcl_ring_size=8192
dp_tqm2ipa_ring_size=8192
dp_ipa_reo2sw5_ring_size=4096

# Control path configuration Parameters
# Add the control path specific config parameters below
# E.g for TID-to-link mapping
# 0 - T2LM is not supported by the MLD
# 1 - MLD only supports the mapping of all TIDs to the same link set
# t2lm_enable=1

# Memory profile setting
# 0 - Indicates the system is not a low memory
# 1 - Implies system is low memory
low_mem_system=0

# RF path switch configuration
# Selects the initial 5G operating frequency range at boot.
# 0 (false) - Primary path:   full 5G range (4890-5930 MHz, ch 36-177) [default]
# 1 (true)  - Secondary path: high 5G range (5490-5930 MHz, ch 100-177)
# When set to 1, firmware is instructed via WMI_INIT resource_config.rf_path,
# the regulatory channel list is restricted to the high range from boot, and
# channels 36-100 will be marked disabled in cfg80211.
rf_switch_config=0

# Carrier_profile_config
# BIT 0 -> enable/disable ssid prioritization configurations
# BIT 1 : 31 Reserved
#
carrier_profile_config=0

#Rep STA OFDMA support
#0 - default value
#1 - Enable 1 Radio(1 bit)
#3 - Enable 2 Radios(2 bit)
#7 - Enable 3 Radios(3 bit)
rep_ul_resp=0

# Cohosted BSS support
#0 - default value
#1 - Enable 1 Radio(1 bit)
#3 - Enable 2 Radios(2 bit)
#7 - Enable 3 Radios(3 bit)
cohosted_bss_ind_enable=0

# BSS color collision detection configuration in STA mode
#true - Enable BSS color collision detection.
#false - Disable BSS color collision detection.
sta_bss_color_collision_detection=true

# MAX_FRAME_SIZE CONFIGURATION
# Defines the maximum management frame size in bytes
# for beacon and probe response frames.
#2000 - Default value
#1500 - Minimum Allowed
#2000 - Maximum Allowed
ap_max_mgmt_frm_sz=2000

# DFS NOL persistence automation
# true  - auto dump on stop/recovery and auto restore on bring-up
# false - disable DFS NOL persistence automation
nol_auto_enable=false

# Compress FW dump support
# 1 - to enable dump compression before upload
compress_fw_dump=0

# Expedited RCU sync during STA destroy (mac80211).
# 1 - use synchronize_rcu_expedited()
# 0 - use synchronize_net()
use_sync_rcu_expedited=1
